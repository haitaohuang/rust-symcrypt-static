[package]
name = "spdm-crypto-symcrypt"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "Classical SymCrypt provider for MigTD's pinned spdm-rs callback API"

[features]
default = ["std"]
std = ["symcrypt-core/std"]
checked = ["symcrypt-core/checked"]

[dependencies]
symcrypt-core = { path = "../symcrypt-core", default-features = false, features = ["encoding"] }
symcrypt-pki = { path = "../symcrypt-pki", default-features = false }
spdmlib.workspace = true
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex"] }
zeroize.workspace = true
der = { version = "0.7.10", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "1.12.0", default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103.17", default-features = false, features = ["alloc"] }

[dev-dependencies]
codec = { git = "https://github.com/ccc-spdm-tools/spdm-rs", rev = "2ff535b36d583190efc08d030e648b82ca9b839a" }
serde_json = "1.0"
