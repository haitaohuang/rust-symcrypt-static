[package]
name = "symcrypt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std cryptographic primitives backed by static native SymCrypt"

[features]
default = ["std", "encoding"]
std = ["dep:getrandom"]
checked = ["symcrypt-static-sys/checked"]
encoding = ["dep:der", "dep:pkcs8", "dep:pkcs1", "dep:sec1"]

[dependencies]
symcrypt-static-sys.workspace = true
zeroize.workspace = true
getrandom = { workspace = true, optional = true }
der = { version = "0.7.10", optional = true, default-features = false, features = ["alloc", "derive", "oid"] }
pkcs8 = { version = "0.10.2", optional = true, default-features = false, features = ["alloc"] }
pkcs1 = { version = "0.7.5", optional = true, default-features = false, features = ["alloc"] }
sec1 = { version = "0.7.3", optional = true, default-features = false, features = ["alloc", "der"] }

[dev-dependencies]
serde_json = "1.0"
